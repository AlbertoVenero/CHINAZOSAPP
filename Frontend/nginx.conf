server {
    listen       80 default_server;
    listen       8080;
    listen       3000;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json font/woff2 image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Proxy inverso para API (con ^~ para evitar conflicto con rutas estáticas)
    location ^~ /api {
        proxy_pass https://siatea.apure.gob.ve/backend/api;
        proxy_ssl_server_name on;
        proxy_set_header Host siatea.apure.gob.ve;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
        proxy_cookie_path / /;
    }

    # Proxy inverso para subir archivos
    location ^~ /upload {
        proxy_pass https://siatea.apure.gob.ve/backend/upload;
        proxy_ssl_server_name on;
        proxy_set_header Host siatea.apure.gob.ve;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
        client_max_body_size 20M;
    }

    # Proxy inverso para archivos estáticos subidos (fotos de sicarios/chinazos)
    # IMPORTANTE: ^~ evita que el bloque de assets locales capture las fotos .jpg/.png y retorne 404
    location ^~ /uploads {
        proxy_pass https://siatea.apure.gob.ve/backend/uploads;
        proxy_ssl_server_name on;
        proxy_set_header Host siatea.apure.gob.ve;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Caché de activos estáticos compilados de Vite (/assets/)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Enrutamiento SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
